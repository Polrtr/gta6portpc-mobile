name: Bug or reproducibility report
description: Report a reproducible documentation, build or test problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach game files, archives, keys, extracted assets or proprietary shader data.
  - type: input
    id: source_revision
    attributes:
      label: Leonida source commit
      description: Run git rev-parse HEAD in the upstream Leonida checkout.
      placeholder: Full commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the commands and steps in order.
      placeholder: |
        1. Configure...
        2. Build...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and error output
      description: Paste only relevant text. Remove private paths and secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Visual Studio/MSVC, CMake and Windows SDK.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: Required for graphics-related reports.
  - type: checkboxes
    id: safety
    attributes:
      label: Submission checklist
      options:
        - label: I have not attached game files, keys, proprietary assets or decrypted data.
          required: true
        - label: I have included the exact command and relevant output.
          required: true
